name: stack

# Starts the whole docker-compose stack and drives one real request through it:
# an operator signs in to Keycloak, and the admin server checks the token, maps
# the roles to permissions and reads the database that Flyway migrated.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Create secrets
        run: |
          openssl rand -base64 32 | tr -d '\n' > secrets/db_password
          openssl rand -base64 32 | tr -d '\n' > secrets/keycloak_admin_password

      - name: Start the stack
        run: docker compose up --detach --build

      - name: Wait for the admin server
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/actuator/health >/dev/null; then
              echo "admin server is up"; exit 0
            fi
            sleep 5
          done
          echo "admin server did not become healthy"; exit 1

      - name: Migrations ran
        run: |
          test "$(docker compose ps --all --format '{{.ExitCode}}' flyway)" = "0"
          docker compose exec -T postgres psql -U opentaan -d opentaan -Atc \
            "SELECT version FROM flyway_schema_history WHERE success ORDER BY installed_rank"

      - name: Game server accepts connections
        run: timeout 10 bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/2180); do sleep 1; done'

      - name: An operator can sign in and read an account
        env:
          OPERATOR_PASSWORD: ${{ github.run_id }}-smoke-test
        run: |
          deploy/keycloak/add-operator.sh smoke-viewer viewer
          docker compose exec -T postgres psql -U opentaan -d opentaan -c \
            "INSERT INTO accounts (account_id, email) VALUES (1, 'player@example.com')"

          token=$(curl --silent --fail \
            --data grant_type=password --data client_id=opentaan-cli \
            --data username=smoke-viewer --data-urlencode "password=$OPERATOR_PASSWORD" \
            http://localhost:8081/realms/opentaan/protocol/openid-connect/token | jq -r .access_token)

          echo "without a token:"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/accounts/1)" = "401"

          echo "with a viewer token:"
          curl --silent --fail -H "Authorization: Bearer $token" http://localhost:8080/api/accounts/1 | tee account.json
          test "$(jq -r .email account.json)" = "player@example.com"

          echo "unknown account:"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://localhost:8080/api/accounts/2)" = "404"

      - name: A large adjustment needs a second operator
        env:
          OPERATOR_PASSWORD: ${{ github.run_id }}-smoke-test
        run: |
          deploy/keycloak/add-operator.sh smoke-requester economy
          deploy/keycloak/add-operator.sh smoke-approver economy
          docker compose exec -T postgres psql -U opentaan -d opentaan -c \
            "INSERT INTO characters (character_id, account_id, slot_index, name, name_key, info_json)
             VALUES (2001, 1, 0, 'Nova', 'nova', '{}')"

          token() {
            curl --silent --fail --data grant_type=password --data client_id=opentaan-cli \
              --data username="$1" --data-urlencode "password=$OPERATOR_PASSWORD" \
              http://localhost:8081/realms/opentaan/protocol/openid-connect/token | jq -r .access_token
          }
          requester=$(token smoke-requester)
          approver=$(token smoke-approver)
          adjustments=http://localhost:8080/api/economy/adjustments
          body='{"characterId": 2001, "deltaGold": 50000, "reason": "smoke test refund"}'
          request() {
            curl --silent --dump-header headers.txt --output "$1" --write-out '%{http_code}' \
              -H "Authorization: Bearer $requester" -H "Idempotency-Key: smoke-${{ github.run_id }}" \
              -H "Content-Type: application/json" --data "$body" "$adjustments"
          }

          echo "request 50,000 gold:"
          test "$(request first.json)" = "201"
          jq . first.json
          id=$(jq -r .adjustmentId first.json)
          test "$(jq -r .status first.json)" = "PENDING_APPROVAL"

          echo "the same request again is a replay, not a second adjustment:"
          test "$(request retry.json)" = "201"
          grep -qi '^idempotent-replayed: true' headers.txt
          test "$(jq -r .adjustmentId retry.json)" = "$id"

          echo "the requester cannot approve it:"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $requester" \
            "$adjustments/$id/approve")" = "403"

          echo "a second operator approves it:"
          curl --silent --fail -X POST -H "Authorization: Bearer $approver" "$adjustments/$id/approve" \
            | jq -e '.status == "APPROVED" and .decidedBy.name == "smoke-approver"'

          echo "it is queued for the game server exactly once:"
          test "$(docker compose exec -T postgres psql -U opentaan -d opentaan -Atc \
            "SELECT count(*) FROM outbox_events WHERE aggregate_id = '$id'")" = "1"

      - name: The audit trail records every action and cannot be changed
        env:
          OPERATOR_PASSWORD: ${{ github.run_id }}-smoke-test
        run: |
          deploy/keycloak/add-operator.sh smoke-auditor auditor
          token() {
            curl --silent --fail --data grant_type=password --data client_id=opentaan-cli \
              --data username="$1" --data-urlencode "password=$OPERATOR_PASSWORD" \
              http://localhost:8081/realms/opentaan/protocol/openid-connect/token | jq -r .access_token
          }
          auditor=$(token smoke-auditor)
          audit=http://localhost:8080/api/audit
          id=$(jq -r .adjustmentId first.json)

          echo "the adjustment's history, newest first; the replay and the refused self-approval left nothing:"
          curl --silent --fail -H "Authorization: Bearer $auditor" \
            "$audit/entries?subjectType=economy-adjustment&subjectId=$id" | tee history.json | jq .
          jq -e '[.[].action] == ["economy.adjustment.approved", "economy.adjustment.requested"]' history.json
          jq -e '[.[].actor.name] == ["smoke-approver", "smoke-requester"]' history.json

          echo "reading an account is recorded; looking up a missing one is not:"
          curl --silent --fail -H "Authorization: Bearer $auditor" "$audit/entries?subjectType=account" \
            | jq -e 'length == 1 and .[0].subjectId == "1" and .[0].actor.name == "smoke-viewer"'

          echo "the chain is intact from the first entry to the last:"
          curl --silent --fail -H "Authorization: Bearer $auditor" "$audit/verification" | tee verification.json | jq .
          jq -e '.intact and .entriesChecked == 3 and .lastSequence == 3' verification.json

          echo "an economy operator cannot read the trail:"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $(token smoke-requester)" \
            "$audit/entries")" = "403"

          echo "the database refuses to change or remove an entry, even for the table's owner:"
          for statement in "UPDATE audit_entries SET actor_name = 'someone else'" "DELETE FROM audit_entries"; do
            if docker compose exec -T postgres psql -U opentaan -d opentaan -v ON_ERROR_STOP=1 -c "$statement"; then
              echo "the database allowed: $statement"; exit 1
            fi
          done
          curl --silent --fail -H "Authorization: Bearer $auditor" "$audit/verification" | jq -e '.intact'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
