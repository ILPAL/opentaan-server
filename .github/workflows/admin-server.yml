name: admin-server

on:
  push:
    branches: [main]
    paths:
      - "admin-server/**"
      - "contracts/openapi/**"
      - "database/**"
      - ".github/workflows/admin-server.yml"
  pull_request:
    paths:
      - "admin-server/**"
      - "contracts/openapi/**"
      - "database/**"
      - ".github/workflows/admin-server.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Unit tests, then integration tests against PostgreSQL in Testcontainers
      # (the runner has Docker) with the real migrations from database/.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-server-test-reports
          path: |
            admin-server/target/surefire-reports
            admin-server/target/failsafe-reports
