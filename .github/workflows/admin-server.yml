name: admin-server

on:
  push:
    branches: [main]
    paths:
      - "admin-server/**"
      - "contracts/openapi/**"
      - "database/**"
      - ".github/workflows/admin-server.yml"
  pull_request:
    paths:
      - "admin-server/**"
      - "contracts/openapi/**"
      - "database/**"
      - ".github/workflows/admin-server.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Unit tests, then integration tests against PostgreSQL in Testcontainers
      # (the runner has Docker) with the real migrations from database/.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-server-test-reports
          path: |
            admin-server/target/surefire-reports
            admin-server/target/failsafe-reports
