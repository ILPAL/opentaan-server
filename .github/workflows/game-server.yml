name: game-server

on:
  push:
    branches: [main]
    paths:
      - "game-server/**"
      - ".github/workflows/game-server.yml"
  pull_request:
    paths:
      - "game-server/**"
      - ".github/workflows/game-server.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: game-server/global.json

      - name: Restore
        run: dotnet restore OpenTaan.GameServer.slnx

      - name: Build
        run: dotnet build OpenTaan.GameServer.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test --solution OpenTaan.GameServer.slnx -c Release --no-build
          --results-directory "$GITHUB_WORKSPACE/game-server/TestResults" --report-xunit-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: game-server-test-results
          path: game-server/TestResults
