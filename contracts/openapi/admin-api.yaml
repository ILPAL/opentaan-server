openapi: 3.0.3
info:
  title: OpenTaan Admin API
  version: 0.3.0
  description: |
    Back-office API for operators: account lookup, economy adjustments and
    the audit trail. This file is the contract. The admin server's controllers
    implement interfaces generated from it, so the code cannot drift from it.

    Every route needs a bearer token from the operator identity provider.
    Each operation lists the permission it requires in `x-permission`.
    Errors use RFC 9457 problem details.
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Accounts
    description: Player accounts and their characters. Read-only; no secrets.
  - name: Economy
    description: |
      Adjustments to a character's gold, under dual control.

      An adjustment whose size is at or above the approval threshold waits for a
      second operator to approve or reject it; the operator who requested it can
      never decide it. Smaller adjustments are approved when requested.

      Approval records the adjustment for delivery to the game server; the
      delivery itself is asynchronous.
  - name: Audit
    description: |
      The audit trail: an entry for every change an operator makes and every
      time an operator reads a player's personal data, written in the same
      transaction as the action. A retry that changes nothing adds no entry;
      an action that fails leaves none.

      Entries cannot be changed or removed, and each one carries the hash of the
      one before it. The verification operation recomputes the whole chain. To
      notice the chain being rebuilt from some point on, keep the `entryHash` of
      an entry you have seen and check later that it has not changed.

paths:
  /api/accounts/{accountId}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get one account and its characters
      x-permission: accounts:read
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/economy/adjustments:
    post:
      tags: [Economy]
      operationId: requestAdjustment
      summary: Request a gold adjustment for a character
      description: |
        Retrying with the same `Idempotency-Key` and the same body returns the
        original result instead of creating a second adjustment. Generate the key
        when the operator opens the adjustment form, not per click, so a
        double-click cannot credit twice.
      x-permission: economy:adjust
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
      responses:
        "201":
          description: |
            The adjustment was recorded, either approved or waiting for approval.
            A retry with the same key returns the same adjustment and sets
            `Idempotent-Replayed: true`.
          headers:
            Location:
              description: URL of the adjustment
              schema:
                type: string
            Idempotent-Replayed:
              description: Present and `true` when this response replays an earlier request.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adjustment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Economy]
      operationId: listAdjustments
      summary: List adjustments, newest first
      x-permission: ledger:read
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AdjustmentStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Adjustments, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Adjustment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/economy/adjustments/{adjustmentId}:
    get:
      tags: [Economy]
      operationId: getAdjustment
      summary: Get one adjustment
      x-permission: ledger:read
      parameters:
        - $ref: "#/components/parameters/AdjustmentId"
      responses:
        "200":
          description: The adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adjustment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/economy/adjustments/{adjustmentId}/approve:
    post:
      tags: [Economy]
      operationId: approveAdjustment
      summary: Approve an adjustment waiting for approval
      description: |
        Only an operator other than the requester may approve. Approving an
        adjustment you already approved returns it unchanged.
      x-permission: economy:adjust
      parameters:
        - $ref: "#/components/parameters/AdjustmentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: The approved adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adjustment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SelfDecision"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/economy/adjustments/{adjustmentId}/reject:
    post:
      tags: [Economy]
      operationId: rejectAdjustment
      summary: Reject an adjustment waiting for approval
      description: |
        Only an operator other than the requester may reject, and a rejection
        must say why. Rejecting an adjustment you already rejected returns it
        unchanged.
      x-permission: economy:adjust
      parameters:
        - $ref: "#/components/parameters/AdjustmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionRequest"
      responses:
        "200":
          description: The rejected adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adjustment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SelfDecision"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/audit/entries:
    get:
      tags: [Audit]
      operationId: listAuditEntries
      summary: List audit trail entries, newest first
      description: |
        Filters combine with AND. To page back through the trail, pass the lowest
        `sequence` of one page as `before` for the next.
      x-permission: audit:read
      parameters:
        - name: subjectType
          in: query
          required: false
          description: What the action was done to, such as `economy-adjustment` or `account`.
          schema:
            type: string
            maxLength: 50
            pattern: "^[a-z]+(-[a-z]+)*$"
        - name: subjectId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: actorId
          in: query
          required: false
          description: The operator who acted, by their identity provider id.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: before
          in: query
          required: false
          description: Only entries with a lower sequence number.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditTrailEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/audit/verification:
    get:
      tags: [Audit]
      operationId: verifyAuditTrail
      summary: Recompute the hash chain from the first entry to the last
      description: |
        Checks that the entries are numbered without gaps, that each one names
        the hash of the one before, and that each hash matches the entry's
        contents. Stops at the first entry that fails.
      x-permission: audit:read
      responses:
        "200":
          description: The result, whether or not the chain is intact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditTrailVerification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique key per intended adjustment, chosen by the client.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]+$"
    AdjustmentId:
      name: adjustmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Account:
      type: object
      required: [accountId, email, characters]
      properties:
        accountId:
          type: integer
          format: int64
        email:
          type: string
        characters:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"

    CharacterSummary:
      type: object
      required: [characterId, name, slot]
      properties:
        characterId:
          type: integer
          format: int64
        name:
          type: string
        slot:
          type: integer
          format: int32
          description: Position on the account's character selection screen.

    AdjustmentRequest:
      type: object
      required: [characterId, deltaGold, reason]
      properties:
        characterId:
          type: integer
          format: int64
          minimum: 1
        deltaGold:
          type: integer
          format: int64
          minimum: -1000000000
          maximum: 1000000000
          description: Gold to add (positive) or remove (negative). Must not be zero.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the adjustment is needed. Shown to the approver and kept with the record.

    ApprovalRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500

    RejectionRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the adjustment was rejected.

    AdjustmentStatus:
      type: string
      enum: [PENDING_APPROVAL, APPROVED, REJECTED]

    OperatorRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Stable identifier from the identity provider.
        name:
          type: string

    Adjustment:
      type: object
      required: [adjustmentId, characterId, deltaGold, reason, status, approvalRequired, requestedBy, requestedAt]
      properties:
        adjustmentId:
          type: string
          format: uuid
        characterId:
          type: integer
          format: int64
        deltaGold:
          type: integer
          format: int64
        reason:
          type: string
        status:
          $ref: "#/components/schemas/AdjustmentStatus"
        approvalRequired:
          type: boolean
          description: Whether the size of the adjustment required a second operator.
        requestedBy:
          $ref: "#/components/schemas/OperatorRef"
        requestedAt:
          type: string
          format: date-time
        decidedBy:
          $ref: "#/components/schemas/OperatorRef"
        decidedAt:
          type: string
          format: date-time
        decisionNote:
          type: string

    AuditTrailEntry:
      type: object
      required: [sequence, entryId, occurredAt, actor, action, subjectType, subjectId, details, previousHash, entryHash]
      properties:
        sequence:
          type: integer
          format: int64
          description: Position in the trail, counting from 1, without gaps.
        entryId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/OperatorRef"
        action:
          type: string
          description: |
            What was done: `account.viewed`, `economy.adjustment.requested`,
            `economy.adjustment.approved` or `economy.adjustment.rejected`.
        subjectType:
          type: string
          description: What it was done to, such as `account` or `economy-adjustment`.
        subjectId:
          type: string
        details:
          type: object
          additionalProperties: true
          description: |
            The facts of the action. For an adjustment, the adjustment as it
            stood after the action.
        previousHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the entry before, or 64 zeros for the first entry.
        entryHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of this entry's fields and `previousHash`.

    AuditTrailVerification:
      type: object
      required: [intact, entriesChecked]
      properties:
        intact:
          type: boolean
          description: Whether every entry fits the chain.
        entriesChecked:
          type: integer
          format: int64
          description: How many entries were found to fit before the check ended.
        lastSequence:
          type: integer
          format: int64
          description: The last entry that fits. Not set if there is none.
        lastHash:
          type: string
          description: That entry's hash.
        brokenAt:
          type: integer
          format: int64
          description: The sequence number where the chain breaks. Set only when it is not intact.
        problem:
          type: string
          description: What is wrong at `brokenAt`.

    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string

  responses:
    BadRequest:
      description: The request is malformed or breaks a constraint in this contract.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid bearer token.
    Forbidden:
      description: The operator lacks the permission this operation requires.
    SelfDecision:
      description: |
        The operator lacks the permission, or is the one who requested the
        adjustment and so may not decide it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        The request conflicts with the current state: the adjustment was already
        decided, it changed while this request was in flight, or the
        Idempotency-Key was used before with a different body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
