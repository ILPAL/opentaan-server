openapi: 3.0.3
info:
  title: OpenTaan Admin API
  version: 0.1.0
  description: |
    Back-office API for operators: account lookup, economy adjustments and
    moderation. This file is the contract. The admin server's controllers
    implement interfaces generated from it, so the code cannot drift from it.

    Every route needs a bearer token from the operator identity provider.
    Each operation lists the permission it requires in `x-permission`.
    Errors use RFC 9457 problem details.
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Accounts
    description: Player accounts and their characters. Read-only; no secrets.

paths:
  /api/accounts/{accountId}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get one account and its characters
      x-permission: accounts:read
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Account:
      type: object
      required: [accountId, email, characters]
      properties:
        accountId:
          type: integer
          format: int64
        email:
          type: string
        characters:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"

    CharacterSummary:
      type: object
      required: [characterId, name, slot]
      properties:
        characterId:
          type: integer
          format: int64
        name:
          type: string
        slot:
          type: integer
          format: int32
          description: Position on the account's character selection screen.

    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string

  responses:
    BadRequest:
      description: The request is malformed, for example a non-numeric id.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid bearer token.
    Forbidden:
      description: The operator lacks the permission this operation requires.
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
